<html lang="fr">
<head>

<meta name="theme-color" content="#f3f6fa">

<style>
:root{--bg:#f2f7f7;--card:#fff;--ink:#0b2a33;--mute:#5a727a;--brand:#0f766e;--soft:#d5efeb;--line:#d9e5e6;--warn:#92400e;--warnbg:#fde9c8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

html{scroll-padding-top:env(safe-area-inset-top,0px)}

.app{max-width:480px;margin:0 auto;padding:16px 16px 110px}

.row:first-of-type{border-top:0}

nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}

.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:20px;padding:7px 12px;font:inherit;font-size:.86rem}.chip.on{background:var(--brand);color:var(--bg);border-color:var(--brand)}
.alert{background:var(--warnbg);color:var(--warn);padding:10px;border-radius:10px;margin:10px 0 0;font-weight:600;font-size:.9rem}.pick{margin:8px 0}h3 span{color:var(--mute);font-weight:400;font-size:.88rem}
.fl{display:block;font-size:.88rem;color:var(--mute);margin-bottom:10px}.fl input,.fl textarea{margin-top:4px}

.lnk{color:var(--brand);font-size:.86rem;margin-left:6px;white-space:nowrap}
/* Espace de travail médecin : une mise en page indépendante du parcours patient. */
body.doctor-mode{background:#f4f7fa;color:#182d40}
.doctor-mode .app{max-width:1540px;padding:0 28px 24px}

.clinic-eyebrow{font-size:10px;color:var(--brand);letter-spacing:1.5px;font-weight:700;text-transform:uppercase;margin-bottom:5px}

.clinic-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:24px}.clinic-kpi{border:1px solid var(--line);border-radius:13px;background:var(--card);padding:17px 18px}.clinic-kpi-head{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--mute);font-size:12px}.clinic-kpi-head .clinic-icon{color:var(--brand)}.clinic-kpi b{display:block;font-size:31px;line-height:1.3;letter-spacing:-1px;margin:9px 0 4px}.clinic-kpi small{color:var(--mute);font-size:11px}
.clinic-grid{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:20px;align-items:start}.clinic-panel{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:20px;margin-bottom:20px;min-width:0}.clinic-panel h3{font-size:15px;letter-spacing:-.2px;align-items:center;margin:0 0 5px;gap:10px}.clinic-panel .subtitle{color:var(--mute);font-size:11px;margin:0 0 17px}.clinic-panel h3 span{font-size:11px}
.clinic-toolbar{display:flex;align-items:center;gap:10px;margin:18px 0}.clinic-search{position:relative;flex:1;min-width:110px}.clinic-search .clinic-icon{position:absolute;left:11px;top:11px;color:var(--mute)}.clinic-search input{padding:10px 12px 10px 36px;background:#f8fafc;font-size:12px;border-color:var(--line)}.clinic select{background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px;font:12px system-ui;color:var(--ink);max-width:190px}
.clinic-table-wrap{overflow:auto}.clinic-table{width:100%;border-collapse:collapse;white-space:nowrap}.clinic-table th{text-align:left;padding:10px 9px;background:#f7f9fb;font-size:10px;font-weight:650;color:var(--mute);text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--line)}.clinic-table td{padding:15px 9px;border-bottom:1px solid #edf1f5;font-size:12px}.clinic-table tr:last-child td{border:0}.clinic-person{display:flex;align-items:center;gap:10px}.clinic-avatar{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:#e5f2ef;color:var(--brand);font-size:12px;font-weight:700;flex-shrink:0}.clinic-person b{display:block;font-size:12px;max-width:210px;overflow-wrap:anywhere;white-space:normal}.clinic-person small{display:block;color:var(--mute);font-size:10px;margin-top:2px}
.clinic-badge{border-radius:6px;padding:4px 7px;background:#eef3f7;color:#65798c;font-size:10px;font-weight:600;display:inline-block;white-space:nowrap}.clinic-badge.review{background:var(--warnbg);color:var(--warn)}.clinic-badge.shared{background:var(--soft);color:var(--brand)}
.clinic-empty{text-align:center;padding:32px 16px;color:var(--mute);font-size:13px}.clinic-empty b{display:block;color:var(--ink);margin-bottom:5px}.clinic-footnote{font-size:10px;color:var(--mute);margin:14px 0 0}
.clinic-appointment{display:flex;gap:12px;padding:14px 0;border-top:1px solid var(--line)}.clinic-appointment:first-of-type{border-top:0}.clinic-date{width:39px;flex-shrink:0;border-radius:9px;background:#f3f7fa;text-align:center;padding:6px 0;color:var(--mute);font-size:9px}.clinic-date b{display:block;font-size:17px;color:var(--ink);line-height:1.2}.clinic-appointment strong{display:block;font-size:12px}.clinic-appointment small{display:block;color:var(--mute);font-size:11px}.clinic-appointment button{padding:0;border:0;background:transparent;text-align:left;color:var(--ink);font:inherit;cursor:pointer}
.clinic-review{border-top:1px solid var(--line);padding:12px 0}.clinic-review:first-of-type{border:0}.clinic-review b{font-size:12px}.clinic-review p{font-size:11px;color:var(--mute);margin:4px 0 9px}.clinic-review .clinic-button{padding:6px 9px;font-size:10px}
.clinic-detail-grid{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:20px;align-items:start}.clinic-detail-title{display:flex;align-items:center;gap:14px}.clinic-detail-title .clinic-avatar{width:52px;height:52px;border-radius:16px;font-size:19px}.clinic-detail-title h2{font-size:24px;overflow-wrap:anywhere}.clinic-detail-title p{font-size:12px}
.clinic-measures{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:19px 0}.clinic-measure{padding:13px;background:#f6f9fb;border-radius:10px}.clinic-measure small{display:block;font-size:10px;color:var(--mute)}.clinic-measure b{font-size:21px;display:block;margin:3px 0}.clinic-measure em{font-style:normal;font-size:10px;color:var(--mute)}.clinic-measure.review{background:#fff6e9}
.clinic .seg{margin:15px 0;gap:6px}.clinic .seg button{font-size:11px;padding:8px;flex:0 1 auto;min-width:65px}.clinic-chart{background:#f8fafc;border-radius:10px;padding:12px;margin-bottom:17px}.clinic-chart svg{max-height:235px;display:block}.clinic-chart .mute{font-size:10px;margin:4px 0 0}
.clinic-info{display:grid;grid-template-columns:minmax(90px,.8fr) minmax(0,1.2fr);gap:10px 12px;margin:15px 0 0;font-size:12px}.clinic-info dt{color:var(--mute)}.clinic-info dd{margin:0;overflow-wrap:anywhere}.clinic-note{background:#f5f9fb;border-radius:10px;padding:12px;font-size:12px;overflow-wrap:anywhere;margin:12px 0}.clinic-note small{display:block;color:var(--mute);font-size:10px;margin-bottom:5px}.clinic textarea{font-size:12px;background:#f8fafc;resize:vertical}.clinic-note-submit{width:100%;margin-top:9px}.clinic .row{font-size:12px}.clinic .row time{font-size:11px}.clinic summary{cursor:pointer;font-weight:650;font-size:13px}.clinic details pre{font-size:12px;background:#f6f9fb;margin-top:14px}.clinic-progress{height:5px;width:85px;background:#e8edf2;border-radius:5px;overflow:hidden;margin-top:5px}.clinic-progress span{display:block;height:100%;background:var(--brand)}.clinic-journal p{font-size:12px;color:var(--mute)}
.doctor-mode #toast{bottom:20px;z-index:20;background:#182d40;color:white}
@media(min-width:1400px){.clinic-grid{grid-template-columns:minmax(0,1fr) 310px}.clinic-detail-grid{grid-template-columns:minmax(0,1fr) 340px}}
@media(max-width:1120px){.doctor-mode .app{padding:0 18px 24px}.clinic{grid-template-columns:175px minmax(0,1fr);gap:20px}.clinic-side{padding-right:14px}.clinic-grid,.clinic-detail-grid{grid-template-columns:minmax(0,1fr)}.clinic-complement{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.clinic-complement .clinic-panel{margin:0}.clinic-kpis{gap:10px}.clinic-kpi{padding:14px}.clinic-kpi-head{font-size:11px}.clinic-heading h2{font-size:25px}}
@media(max-width:760px){.doctor-mode .app{padding:0 14px 20px}.clinic{display:block}.clinic-side{height:auto;position:static;border:0;flex-direction:row;align-items:center;justify-content:space-between;padding:20px 0 12px;gap:15px;flex-wrap:wrap}.clinic-logo{font-size:19px}.clinic-menu{width:100%;flex-direction:row;order:3;overflow-x:auto;gap:3px}.clinic-menu button{flex:1;white-space:nowrap;font-size:11px;padding:10px 7px;gap:5px;justify-content:center}.clinic-menu .clinic-icon{display:none}.clinic-side-bottom{margin:0}.clinic-helper,.clinic-user{display:none}.clinic-top{height:52px;font-size:10px}.clinic-heading{align-items:flex-start;gap:12px;margin:22px 0 18px}.clinic-heading h2{font-size:23px}.clinic-heading p{font-size:12px}.clinic-heading>.clinic-actions{justify-content:flex-end}.clinic-button{font-size:11px;padding:8px 10px}.clinic-kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.clinic-kpi b{font-size:27px}.clinic-complement{grid-template-columns:minmax(0,1fr)}.clinic-panel{padding:16px}.clinic-toolbar{flex-wrap:wrap}.clinic-toolbar select{max-width:100%;flex:1}.clinic-heading:has(.clinic-detail-title){flex-direction:column}.clinic-heading:has(.clinic-detail-title)>.clinic-actions{justify-content:flex-start}.clinic-detail-title h2{font-size:21px}.clinic-measures{gap:7px}.clinic-measure{padding:10px}.clinic-measure b{font-size:18px}.clinic-banner{font-size:11px}.clinic-detail-grid{gap:0}.clinic-top-date{display:none}}
@media print{body.doctor-mode{background:white}.doctor-mode .app{max-width:none;padding:0}.clinic{display:block}.clinic-side,.clinic-top,.clinic-actions,.clinic-banner,.clinic-toolbar,.clinic-button,.clinic .seg,.clinic-note-editor,#toast{display:none!important}.clinic-panel{break-inside:avoid;border-color:#ddd}.clinic-detail-grid,.clinic-grid{display:block}.clinic-heading{margin-top:0}.clinic details pre{display:block}.clinic details{display:block}}

/* ChroniCare : couleurs adaptatives, surfaces douces et mouvements mesurés. */
:root{--page:#f3f6fa;--surface:#ffffff;--surface-soft:#edf2f7;--text:#172c3d;--muted:#587085;--border:#d8e3eb;--accent:#087f78;--accent-soft:#e3f3ef;--button-ink:#fff;--glass:rgba(255,255,255,.85);--shadow:0 10px 32px rgba(19,47,66,.045);--danger:#b42332;--danger-soft:#fff0f1;--bg:var(--page);--card:var(--surface);--ink:var(--text);--mute:var(--muted);--brand:var(--accent);--soft:var(--accent-soft);--line:var(--border);color-scheme:light}
:root[data-theme=dark]{--page:#0b121e;--surface:#151f2e;--surface-soft:#1c2a3b;--text:#e8eff8;--muted:#a6b8cb;--border:#2b3c50;--accent-soft:#183c39;--glass:rgba(21,31,46,.9);--shadow:0 12px 32px rgba(0,0,0,.13);--button-ink:#101827;--danger:#ff9da7;--danger-soft:#39222d;--bg:var(--page);--card:var(--surface);--ink:var(--text);--mute:var(--muted);--brand:var(--accent);--soft:var(--accent-soft);--line:var(--border);--warn:#f5cd86;--warnbg:#392d1c;color-scheme:dark}
html{scroll-behavior:smooth}body,body.doctor-mode{background:radial-gradient(ellipse at 12% 0%,var(--accent-soft),transparent 44%),var(--page);color:var(--text);transition:background-color .3s ease,color .3s ease}body{min-height:100vh}
button,a,input,textarea,select{transition:background-color .2s,color .2s,border-color .2s,box-shadow .2s,transform .15s}button:hover:not(:disabled){filter:brightness(1.03)}button:active:not(:disabled){transform:scale(.98)}.card,.clinic-panel,.clinic-kpi{box-shadow:var(--shadow);border-radius:18px}.card:hover,.clinic-kpi:hover{box-shadow:0 12px 34px color-mix(in srgb,var(--accent) 8%,transparent)}.btn{color:var(--button-ink)}.seg .on,.chip.on{color:var(--button-ink)}

<body>
<div class="app"><div id="utilities" class="utility-bar"></div><div id="translation-scope" class="language-notice" hidden></div><h1 style="display:flex;justify-content:space-between;align-items:center">ChroniCare<span id="who"></span></h1><div id="view"></div>
<p class="mute">Prototype de démonstration : ne remplace pas l'avis d'un médecin.</p></div>
<div id="toast" role="status"></div>
<nav id="nav"></nav>
<script>
const $=s=>document.querySelector(s),K0='chronicare-v1';let K=K0,U=null;
let S={meds:[],taken:{},readings:[],sym:{},mood:{},rdv:[],s0:Date.now()},tab='home',cur='gly';
const fresh=()=>({meds:[],taken:{},readings:[],sym:{},mood:{},rdv:[],s0:Date.now()});
function load(){S=fresh();try{const r=localStorage.getItem(K);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}}
let storageFailed=false;
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S));storageFailed=false;updateNetworkStatus();return true}catch(e){storageFailed=true;updateNetworkStatus();toast('Échec de sauvegarde : stockage plein ou bloqué. Les dernières modifications ne sont pas conservées.');return false}};
const day=d=>{d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const T={gly:{n:'Glycémie',u:'g/L',lo:.2,hi:6},tens:{n:'Tension',u:'mmHg',lo:60,hi:260},poids:{n:'Poids',u:'kg',lo:2,hi:400},fc:{n:'Pouls',u:'bpm',lo:25,hi:240},spo2:{n:'Saturation',u:'%',lo:50,hi:100},sommeil:{n:'Sommeil',u:'h',lo:0,hi:24},activite:{n:'Activité',u:'min',lo:0,hi:1440},pas:{n:'Pas',u:'pas',lo:0,hi:100000}};
const URG=['Douleur à la poitrine','Essoufflement','Oppression thoracique'];
const D={diabete:{n:'Diabète',t:['gly','poids','tens'],s:['Soif excessive','Urines fréquentes','Faim inhabituelle','Fatigue','Vision floue','Picotements aux mains ou aux pieds','Plaie qui guérit mal'],tip:['Mesure ta glycémie aux moments indiqués par ton médecin et note-la toujours de la même façon.','Regarde tes pieds chaque jour : une petite plaie doit être montrée vite.']},
hta:{n:'Hypertension',t:['tens','fc','poids'],s:['Maux de tête','Vertiges','Vision floue','Bourdonnements d\'oreilles','Saignement de nez','Douleur à la poitrine','Essoufflement'],tip:['Mesure ta tension assis, après 5 minutes de repos, le bras à hauteur du cœur.','Prends tes médicaments tous les jours, même quand tu te sens bien.']},
asthme:{n:'Asthme / BPCO',t:['spo2','fc','poids'],s:['Essoufflement','Sifflements','Toux','Oppression thoracique','Réveil la nuit','Crachats'],tip:['Garde ton inhalateur de secours à portée de main.','Note ce qui déclenche tes crises (poussière, fumée, effort) pour en parler à ton médecin.']},
foie:{n:'Maladie du foie',t:['poids','tens','fc'],s:['Fatigue','Douleurs au ventre','Jaunisse','Perte d\'appétit','Nausées','Urines foncées','Démangeaisons','Ventre gonflé'],tip:['Ne prends aucun médicament ni plante sans avis médical : le foie les filtre tous.','Évite l\'alcool et demande à ton médecin ce qui est permis pour toi.']},
autre:{n:'Autre maladie chronique',t:['poids','tens','fc'],s:['Fatigue','Douleur','Nausées','Perte d\'appétit','Mauvais sommeil'],tip:['Note tes symptômes chaque jour : ton médecin verra mieux l\'évolution.','Garde tous tes rendez-vous de suivi.']}};
Object.values(D).forEach(x=>x.t.push('sommeil','activite','pas'));
const G={sommeil:i=>[+(6.5+Math.sin(i)).toFixed(1)],activite:i=>[Math.round(35+15*Math.sin(i*1.4))],pas:i=>[Math.round(4500+2500*Math.sin(i*1.2))],gly:i=>[+(1+.3*Math.sin(i*1.7)+(i%6===0?.4:0)).toFixed(2)],tens:i=>[Math.round(128+10*Math.sin(i*1.3)+(i%7===0?14:0)),Math.round(82+5*Math.sin(i*1.9))],poids:i=>[+(72+.4*Math.sin(i)).toFixed(1)],fc:i=>[Math.round(74+6*Math.sin(i*1.1))],spo2:i=>[Math.round(96+1.5*Math.sin(i*2.1))]};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=r=>r.type==='tens'?r.v1+'/'+r.v2:r.v1;
function flag(r){if(r.type==='gly')return r.v1<.7?'basse':r.v1>1.8?'élevée':'';if(r.type==='tens')return r.v1>=140||r.v2>=90?'élevée':'';if(r.type==='fc')return r.v1<50?'basse':r.v1>100?'élevée':'';if(r.type==='spo2')return r.v1<92?'basse':'';return''}
const last=t=>S.readings.filter(r=>r.type===t).sort((a,b)=>b.t-a.t)[0];
function toast(m){if(storageFailed&&/enregistr|chargé/.test(m))m='Échec de sauvegarde : les dernières modifications ne sont pas conservées.';const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',3500)}
function tile(t){const r=last(t),f=r?flag(r):'';return `<div class="tile ${f?'f':''}"><small>${T[t].n}</small><b>${r?fmt(r):'—'}</b><em>${r?T[t].u:'aucune'}</em>${f?`<i>${f}</i>`:''}</div>`}
function home(){if(appearance.easyMode)return easyHome();const tk=S.taken[day()]||[],ms=[...S.meds].sort((a,b)=>a.time.localeCompare(b.time)),n=ms.filter(m=>tk.includes(m.id)).length,p=ms.length?n/ms.length:0,C=2*Math.PI*40;
return `<h2>Aujourd'hui</h2><p class="mute">${new Date().toLocaleDateString(uiLocale(),{weekday:'long',day:'numeric',month:'long'})}</p>
<section class="card"><div class="ring"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="none" stroke="var(--soft)" stroke-width="12"/><circle cx="50" cy="50" r="40" fill="none" stroke="var(--brand)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p)}"/></svg><div><b>${n} sur ${ms.length}</b>prises faites aujourd'hui</div></div>
${ms.map(m=>`<label class="row"><input type="checkbox" ${tk.includes(m.id)?'checked':''} onchange="tog('${m.id}')"><span>${esc(m.name)}</span><time>${m.time}</time></label>`).join('')||'<p class="mute">Ajoute ton premier médicament dans l\'onglet Médicaments.</p>'}</section>
${extra()}<section class="card"><h3>Dernières mesures</h3><div class="tiles">${D[S.dz].t.map(tile).join('')}</div><button class="btn" onclick="go('mes')">Ajouter une mesure</button></section>`}
function chart(rs){if(rs.length<2)return'<p class="mute">Enregistre au moins 2 mesures pour voir la courbe.</p>';
const W=320,H=120,p=14,v=rs.flatMap(r=>cur==='tens'?[r.v1,r.v2]:[r.v1]),lo=Math.min(...v),hi=Math.max(...v),sp=(hi-lo)||1;
const pt=(x,i)=>`${p+i*(W-2*p)/(rs.length-1)},${H-p-(x-lo)/sp*(H-2*p)}`;
const ln=(k,c)=>`<polyline fill="none" stroke="${c}" stroke-width="2.5" stroke-linejoin="round" points="${rs.map((r,i)=>pt(r[k],i)).join(' ')}"/>`;
return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Courbe ${T[cur].n}">${ln('v1','var(--brand)')}${cur==='tens'?ln('v2','var(--mute)'):''}</svg><p class="mute">Min ${lo}, max ${hi} ${T[cur].u}${cur==='tens'?'. Trait gris : diastolique.':''}</p>`}

function renderModule(){const content=({help:helpPage,hospitals:hospitalsPage,forum:forumPage,security:securityPage,install:installPage,appearance:appearancePage,languages:languagesPage})[modulePage]();$('#nav').innerHTML='';if(U&&ROLE==='medecin'){$('#view').innerHTML=doctorShell(content)}else $('#view').innerHTML=content}
function appearancePage(){return moduleHeader('appearance','Une interface qui s’adapte à votre environnement et à vos préférences.')+`<div class="module-grid"><section class="card module-card"><h3>Jour, nuit ou automatique</h3><p>Le mode automatique suit le réglage de votre appareil.</p><div class="theme-options">${[['auto','Automatique'],['light','Jour'],['dark','Nuit']].map(([k,n])=>`<button class="theme-choice ${appearance.mode===k?'selected':''}" aria-pressed="${appearance.mode===k}" onclick="setAppearance('mode','${k}')">${n}</button>`).join('')}</div></section><section class="card module-card"><h3>Votre couleur d’accent</h3><p>Les boutons, la navigation et les courbes partagent la même palette.</p><div class="theme-options">${Object.entries(accentPalettes).map(([k,p])=>`<button class="theme-choice ${appearance.accent===k?'selected':''}" aria-pressed="${appearance.accent===k}" onclick="setAppearance('accent','${k}')"><span class="theme-swatch" style="--swatch:${p.light}"></span>${p.label}</button>`).join('')}</div></section><section class="card module-card module-full"><h3>Animations et confort de lecture</h3><div class="module-actions"><button class="utility-button" onclick="openModule('languages')">Langues & accessibilité</button></div><p>Transitions courtes, apparition des écrans, tracé des courbes et retours au toucher. Les réglages de réduction des mouvements de votre appareil sont respectés.</p><label class="row"><input type="checkbox" ${appearance.motion?'checked':''} onchange="setAppearance('motion',this.checked)"><span>Activer les animations douces</span></label><p class="module-note">Ces préférences sont conservées dans ce navigateur. Elles sont communes aux espaces patient et médecin.</p></section></div>`}

function hospitalCard(h){const map='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(h.name+' '+h.address+' '+h.city+' '+h.country);return `<article class="card module-card module-hospital"><div class="module-actions" style="justify-content:space-between"><span class="module-tag">${h.city} · ${h.country}</span><button class="utility-button" aria-label="${favorites().includes(h.id)?'Retirer des':'Ajouter aux'} favoris : ${esc(h.name)}" onclick="toggleHospital('${h.id}')">${favorites().includes(h.id)?'★':'☆'}</button></div><h3 style="margin-top:12px">${esc(h.name)}</h3><p class="mute">${esc(h.address)}</p>${h.emergency?`<p><b>${esc(h.emergencyLabel)}</b><br>${esc(h.emergency)}</p>`:`<p class="mute">${esc(h.emergencyLabel)}</p>`}<div class="module-actions">${h.emergency?`<a class="utility-button emergency-link" href="tel:${h.emergency}">Appeler les urgences</a>`:''}<a class="utility-button" href="tel:${h.phone}">Appeler le ${h.emergency?'contact':'standard'}</a><a class="utility-button" href="${map}" target="_blank" rel="noopener noreferrer">Carte</a>${h.email?`<a class="utility-button" href="mailto:${h.email}">Email</a>`:''}</div><a class="source-link" href="${h.source}" target="_blank" rel="noopener noreferrer">Source officielle · consultée le 07/10/2026 ↗</a>${h.contactSource?`<br><a class="source-link" href="${h.contactSource}" target="_blank" rel="noopener noreferrer">Adresse et contact ↗</a>`:''}</article>`}
function hospitalsPage(){const matches=HOSPITALS.filter(h=>(directoryZone==='all'||(directoryZone==='kinshasa'?h.city==='Kinshasa':directoryZone==='africa'?h.area==='africa':h.area==='world'))&&(!directoryFavoritesOnly||favorites().includes(h.id))&&(h.name+' '+h.city+' '+h.country+' '+h.address).toLocaleLowerCase('fr').includes(directoryQuery.toLocaleLowerCase('fr')));return moduleHeader('hospitals','Un premier annuaire de 8 établissements et sites hospitaliers, avec appels directs et cartes.')+`<p class="module-note">L’annuaire n’est pas exhaustif et n’indique pas la disponibilité des soins en temps réel. Un standard hospitalier et un numéro d’urgence sont distingués. Les numéros courts fonctionnent localement, selon l’opérateur.</p><section class="card module-card"><div class="directory-toolbar"><input id="hospital-search" type="search" aria-label="Rechercher un hôpital" placeholder="Nom, ville, pays…" value="${esc(directoryQuery)}" oninput="filterHospitals('query',this.value)"><select aria-label="Zone des hôpitaux" onchange="filterHospitals('zone',this.value)">${[['kinshasa','Kinshasa'],['africa','Afrique'],['world','Hors Afrique'],['all','Tout l’annuaire']].map(([k,n])=>`<option value="${k}" ${directoryZone===k?'selected':''}>${n}</option>`).join('')}</select></div><label class="row"><input type="checkbox" ${directoryFavoritesOnly?'checked':''} onchange="filterHospitals('favorites',this.checked)"><span>Afficher mes favoris uniquement</span></label><small>${matches.length} résultat(s)</small></section><div class="module-grid">${matches.map(hospitalCard).join('')||'<div class="module-empty module-full">Aucun établissement pour cette recherche.</div>'}</div><section class="card module-card" style="margin-top:16px"><h3>Une autre ville ?</h3><p>Ouvre une recherche cartographique sans partager tes données médicales.</p><div class="inp"><input id="map-city" aria-label="Ville à rechercher" placeholder="Ville et pays"><button class="utility-button" onclick="searchCityHospitals()">Rechercher</button></div></section>`}
function searchCityHospitals(){const value=$('#map-city').value.trim();if(!value)return toast('Indique une ville et un pays.');window.open('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent('hôpitaux urgences '+value),'_blank','noopener,noreferrer')}
function helpPage(){const contact=ccRead('cc-site-contacts',{phone:'',email:'',newsletter:''}),sos=U&&ROLE==='patient'?S.sos:null,editable=U&&ROLE==='medecin'&&!doctorPreview;return moduleHeader('help','Des contacts utiles à portée de main, même avant la connexion.')+`<section class="module-urgent"><h3>Urgence médicale à Kinshasa</h3><p>ChroniCare ne reçoit pas les appels de secours. Contacte directement un service médical. Ces boutons lancent l’appel depuis ton téléphone.</p><div class="module-actions"><a class="utility-button emergency-link" href="tel:+243890003052">SAMU Monkole · +243 890 003 052</a><a class="utility-button emergency-link" href="tel:4309">Urgences HJ · 4309 (local)</a><button class="utility-button" onclick="openModule('hospitals')">Voir les hôpitaux</button></div><p style="margin-top:11px;margin-bottom:0"><a href="https://monkole.cd/urgences/" target="_blank" rel="noopener noreferrer" style="color:inherit">Monkole : source officielle ↗</a> · <a href="https://www.hjhospitals.org/fr/contact-us" target="_blank" rel="noopener noreferrer" style="color:inherit">HJ : source officielle ↗</a></p></section><div class="module-grid"><section class="card module-card"><h3>Contacter ChroniCare</h3><p>Questions sur l’application, partenariats et accompagnement.</p><div class="module-actions">${contact.phone?`<a class="utility-button" href="tel:${esc(contact.phone)}">Téléphone · ${esc(contact.phone)}</a>`:'<span class="module-tag pending">Téléphone à renseigner</span>'}${contact.email?`<a class="utility-button" href="mailto:${esc(contact.email)}">${esc(contact.email)}</a>`:'<span class="module-tag pending">Email à renseigner</span>'}</div><p class="module-note">Les coordonnées propres à ChroniCare doivent être renseignées par l’équipe du projet. Aucun numéro ni email fictif n’est utilisé.</p></section><section class="card module-card"><h3>Newsletter ChroniCare</h3><p>Actualités du projet et ressources d’accompagnement.</p>${contact.newsletter?`<a class="btn" href="${esc(contact.newsletter)}" target="_blank" rel="noopener noreferrer">Ouvrir le formulaire d’inscription ↗</a><p><small>L’inscription se fait auprès du service de newsletter configuré.</small></p>`:'<span class="module-tag pending">Service d’inscription à connecter</span><p class="module-note">L’envoi de newsletters sera disponible après configuration d’un service d’emailing et de son formulaire de consentement. Aucune adresse email n’est collectée ici.</p>'}</section><section class="card module-card module-full"><h3>Ma personne à prévenir</h3>${U&&ROLE==='patient'?`<p>Un proche que tu peux appeler directement. Ce contact reste dans ton dossier local.</p><label class="fl">Nom du proche<input id="sos-name" value="${esc(sos?.name||'')}" placeholder="Nom"></label><label class="fl">Téléphone<input id="sos-phone" type="tel" value="${esc(sos?.phone||'')}" placeholder="+243…"></label><button class="btn" onclick="saveSOS()">Enregistrer le contact</button>${sos?.phone?`<a class="btn" href="tel:${esc(sos.phone)}">Appeler ${esc(sos.name||'mon proche')}</a>`:''}`:'<p>Cette fonction est disponible après connexion avec un compte patient.</p>'}</section>${editable?`<section class="card module-card module-full"><details><summary>Configurer les contacts du prototype</summary><p>Réglages conservés dans ce navigateur. Ils devront être centralisés avant le lancement public.</p><label class="fl">Téléphone ChroniCare<input id="config-phone" type="tel" value="${esc(contact.phone)}" placeholder="Numéro réel de l’équipe"></label><label class="fl">Email ChroniCare<input id="config-email" type="email" value="${esc(contact.email)}" placeholder="Adresse réelle de l’équipe"></label><label class="fl">URL HTTPS du formulaire newsletter<input id="config-newsletter" type="url" value="${esc(contact.newsletter)}" placeholder="https://…"></label><button class="btn" onclick="saveSiteContacts()">Enregistrer les coordonnées</button></details></section>`:''}</div>`}
function saveSOS(){if(!U||ROLE!=='patient')return;const name=$('#sos-name').value.trim(),phone=$('#sos-phone').value.trim();if(name.length<2||!/^\+?[0-9 ()-]{6,25}$/.test(phone))return toast('Indique un nom et un numéro de téléphone valide.');S.sos={name,phone:phone.replace(/[ ()-]/g,'')};save();render();toast('Contact enregistré.')}
function saveSiteContacts(){if(!U||ROLE!=='medecin'||doctorPreview)return;const phone=$('#config-phone').value.trim(),email=$('#config-email').value.trim(),newsletter=$('#config-newsletter').value.trim();if(phone&&!/^\+?[0-9 ()-]{6,25}$/.test(phone))return toast('Vérifie le numéro de téléphone.');if(email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return toast('Vérifie l’adresse email.');if(newsletter){try{const u=new URL(newsletter);if(u.protocol!=='https:'||u.username||u.password)throw Error()}catch{return toast('Le formulaire doit avoir une URL HTTPS valide.')}}if(ccWrite('cc-site-contacts',{phone:phone.replace(/[ ()-]/g,''),email,newsletter})){render();toast('Coordonnées enregistrées localement.')}}
function securityPage(){const features=[['google','Google','Se connecter avec son compte Google, y compris une adresse Gmail.','Configurer un client OAuth et vérifier les identifiants sur le serveur.','https://developers.google.com/identity/gsi/web/guides/overview'],['apple','Apple','Se connecter avec son compte Apple. iCloud n’est pas une méthode de connexion distincte.','Configurer Sign in with Apple, le domaine et le retour de connexion.','https://developer.apple.com/sign-in-with-apple/'],['passkey','Face ID & empreinte','Utiliser une passkey, avec déverrouillage par le système du téléphone.','Un serveur vérifie la clé. Le téléphone choisit Face ID, empreinte ou code selon sa configuration.','https://developers.google.com/identity/passkeys'],['2fa','Double authentification','Ajouter un code d’une application d’authentification (TOTP) à la connexion par mot de passe.','Gérer l’inscription, la vérification côté serveur, les codes de secours et les limites d’essais.','https://pages.nist.gov/800-63-4/sp800-63b.html']];return moduleHeader('security','Les méthodes prévues pour sécuriser la prochaine version connectée.')+`<section class="card module-card"><h3>Configurer Apple, Google, passkeys et MFA</h3><p>Un service d’identité comme Clerk regroupe ces méthodes. Créer un projet, déclarer l’URL HTTPS de ChroniCare, activer Google et Apple dans les connexions SSO, puis configurer les passkeys et la double authentification. Relier ensuite son SDK au site et vérifier les sessions dans une API sécurisée. Certains réglages de production demandent un abonnement.</p><div class="module-actions"><a class="utility-button" href="https://dashboard.clerk.com" target="_blank" rel="noopener noreferrer">Ouvrir Clerk ↗</a><a class="utility-button" href="https://clerk.com/docs/guides/configure/auth-strategies/social-connections/google" target="_blank" rel="noopener noreferrer">Configurer Google ↗</a><a class="utility-button" href="https://clerk.com/docs/guides/configure/auth-strategies/social-connections/apple" target="_blank" rel="noopener noreferrer">Configurer Apple ↗</a><a class="utility-button" href="https://clerk.com/docs/guides/configure/auth-strategies/sign-up-sign-in-options" target="_blank" rel="noopener noreferrer">Passkeys et MFA ↗</a></div></section><p class="module-note">Le prototype utilise actuellement des comptes conservés dans ce navigateur. Les méthodes ci-dessous ne sont pas encore activées et aucun mot de passe Apple ou Google n’est demandé par ChroniCare.</p><div class="module-security-grid">${features.map(([id,n,desc,need,url])=>`<article class="security-feature" ${securityFocus===id?'style="border-color:var(--accent)"':''}><h3>${n}</h3><span class="module-tag pending">À connecter au serveur</span><p>${desc}</p><p><b>Pour l’activer :</b> ${need}</p><div class="module-actions"><a class="utility-button" href="${url}" target="_blank" rel="noopener noreferrer">Documentation officielle ↗</a>${id==='passkey'?'<button class="utility-button" onclick="checkPasskeySupport()">Vérifier mon appareil</button>':''}</div></article>`).join('')}</div><section class="card module-card" style="margin-top:16px"><h3>La biométrie reste sur ton appareil</h3><p>Une passkey ne transmet ni ton visage ni ton empreinte à ChroniCare. Elle apporte une preuve cryptographique de connexion. L’application ne peut pas imposer Face ID ou un capteur particulier à tous les appareils.</p><p id="passkey-result" class="module-note" role="status">Compatibilité non testée. Vérifier l’appareil n’active pas la connexion biométrique.</p></section><section class="card module-card"><h3>Avant de traiter de vrais dossiers</h3><p>Aucune application n’est inviolable. Les données de santé du prototype sont conservées en clair dans le navigateur. Le rôle médecin est un rôle de démonstration, sans vérification professionnelle.</p><p>La version de production exige une API qui contrôle chaque accès, un stockage chiffré, des permissions par patient et établissement, des journaux d’accès, des sauvegardes protégées et des audits. Ne pas enregistrer de vraies données de santé dans cette démonstration.</p><p>Le prototype ferme la session après 15 minutes sans activité et arrête les capteurs à la déconnexion. Ce verrouillage de confort ne remplace pas des sessions contrôlées par un serveur.</p><a class="utility-button" href="https://mas.owasp.org/MASVS/" target="_blank" rel="noopener noreferrer">Référentiel OWASP MASVS ↗</a></section>`}
function authInfo(method){securityFocus=method;openModule('security')}
async function checkPasskeySupport(){const el=$('#passkey-result');try{if(!window.isSecureContext||!window.PublicKeyCredential?.isUserVerifyingPlatformAuthenticatorAvailable){el.textContent='La détection des passkeys est indisponible dans ce contexte. Utilise une URL HTTPS et un navigateur compatible.';return}const available=await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();el.textContent=available?'Un authentificateur intégré est disponible. Le serveur doit encore être connecté pour créer et vérifier une passkey.':'Aucun authentificateur intégré détecté dans ce navigateur. Une autre méthode de connexion restera nécessaire.'}catch{el.textContent='Impossible de vérifier la compatibilité sur cet appareil.'}}
let deferredInstall=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;if(modulePage==='install')render()});addEventListener('appinstalled',()=>{deferredInstall=null;toast('ChroniCare ajouté à l’appareil.');if(modulePage==='install')render()});
async function promptInstall(){if(!deferredInstall)return toast('Ouvre le menu du navigateur pour ajouter ChroniCare à l’écran d’accueil.');const event=deferredInstall;await event.prompt();await event.userChoice;deferredInstall=null;if(modulePage==='install')render()}
function installPage(){const standalone=window.matchMedia?.('(display-mode: standalone)').matches||navigator.standalone,hosted=location.protocol==='https:'||['localhost','127.0.0.1','[::1]'].includes(location.hostname);return moduleHeader('install','Une même application web pour iPhone, Android et ordinateur.')+`<section class="card module-card"><span class="module-tag ${standalone?'':'pending'}">${standalone?'Ouvert comme une application':hosted?'Accessible depuis le navigateur':'Fichier local — hébergement HTTPS requis'}</span><p>Le pack mobile fourni contient la version web installable (PWA), ses icônes et son accès hors connexion au prototype après une première visite. Il doit être déployé sur une URL HTTPS avant l’installation sur téléphone.</p>${deferredInstall?'<button class="btn" onclick="promptInstall()">Installer ChroniCare sur cet appareil</button>':''}</section><section class="card module-card"><h3>Mettre le pack en ligne</h3><ol><li>Télécharge et décompresse ChroniCare-mobile.zip sur ton ordinateur.</li><li>Ouvre Netlify Drop, connecte-toi et dépose le dossier qui contient index.html, sw.js, le manifeste et les icônes.</li><li>Copie l’URL HTTPS créée et ouvre-la sur ton téléphone ou ta tablette.</li><li>Attends la fin du chargement, installe puis teste le mode avion.</li></ol><a class="utility-button" href="https://app.netlify.com/drop" target="_blank" rel="noopener noreferrer">Déployer avec Netlify Drop ↗</a><p class="module-note">Cette mise en ligne publie le prototype. Elle ne crée pas le serveur de comptes ni la synchronisation. Les anciens comptes locaux ne migrent pas automatiquement vers cette nouvelle URL.</p></section><div class="module-grid"><section class="card module-card"><h3>Sur iPhone</h3><ol><li>Ouvre l’URL HTTPS de ChroniCare dans Safari.</li><li>Ouvre le menu de la page ou le bouton Partager.</li><li>Choisis <b>Sur l’écran d’accueil</b> / <b>Ajouter à l’écran d’accueil</b>.</li><li>Si proposé, active <b>Ouvrir comme app web</b>, puis Ajouter.</li></ol><a class="source-link" href="https://support.apple.com/en-gb/guide/iphone/iph42ab2f3a7/ios" target="_blank" rel="noopener noreferrer">Guide officiel Apple ↗</a></section><section class="card module-card"><h3>Sur Android</h3><ol><li>Ouvre l’URL HTTPS de ChroniCare dans Chrome.</li><li>Ouvre le menu ⋮.</li><li>Choisis <b>Installer et créer un raccourci</b>, puis <b>Installer</b>, selon le navigateur.</li><li>Retrouve l’icône ChroniCare sur ton téléphone.</li></ol><a class="source-link" href="https://support.google.com/chrome/answer/9658361?co=GENIE.Platform%3DAndroid&hl=fr" target="_blank" rel="noopener noreferrer">Guide officiel Google ↗</a></section><section class="card module-card module-full"><h3>Tablette et ordinateur</h3><p>iPad : installer depuis Safari comme sur iPhone. Tablette Android : installer depuis Chrome. Windows, macOS ou Linux : ouvrir la même URL ; utiliser l’option d’installation si le navigateur la propose. L’espace médecin s’élargit avec l’écran.</p><h3>Ce que l’installation permet</h3><p>Une icône sur le téléphone, une ouverture comme une application et un affichage adapté. Les données du prototype restent propres à chaque navigateur : l’installation ne crée pas de synchronisation patient–médecin entre appareils.</p><p class="module-note">App Store et Google Play nécessitent ensuite une application empaquetée et une publication sur les stores. La connexion sécurisée et le forum partagé exigent aussi un serveur.</p></section></div>`}
const FORUM_CHANNELS=['Tous','Vie quotidienne','Diabète','Hypertension','Respiration','Soutien'];

let forumChannel='Tous',forumDraft={alias:'',channel:'Vie quotidienne',title:'',body:''},forumReplyDrafts={},forumDemoPosts=[],forumDemoReports=[];

function forumPage(){const permitted=!!U&&(doctorPreview||ROLE==='medecin'||!!S.consent),posts=forumPosts().filter(p=>(forumChannel==='Tous'||p.channel===forumChannel)&&!forumReports().some(r=>r.post===p.id&&r.user===U)).sort((a,b)=>b.t-a.t);return moduleHeader('forum','Échanger sur le quotidien, trouver du soutien et partager son expérience.')+`<p class="module-note"><b>Forum de démonstration locale.</b> Les messages restent dans ce navigateur et ne sont pas transmis à d’autres appareils. Les discussions d’exemple sont signalées. Pour réunir de vrais patients, il faudra un serveur et une modération.</p><div class="forum-channel-bar">${FORUM_CHANNELS.map(c=>`<button class="theme-choice ${c===forumChannel?'selected':''}" onclick="setForumChannel('${c}')">${c}</button>`).join('')}</div><div class="forum-layout"><div>${permitted?`<section class="card module-card"><h3>Ouvrir une discussion</h3><label class="fl">Pseudo public<input id="forum-alias" maxlength="32" value="${esc(forumDraft.alias||'')}" placeholder="Un pseudo, pas ton nom complet" oninput="captureForumDraft()"></label><label class="fl">Thème<select id="forum-channel" onchange="captureForumDraft()">${FORUM_CHANNELS.slice(1).map(c=>`<option ${forumDraft.channel===c?'selected':''}>${c}</option>`).join('')}</select></label><label class="fl">Titre<input id="forum-title" maxlength="120" value="${esc(forumDraft.title)}" placeholder="Le sujet de ta discussion" oninput="captureForumDraft()"></label><label class="fl">Message<textarea id="forum-body" rows="3" maxlength="2000" placeholder="Partage ton expérience…" oninput="captureForumDraft()">${esc(forumDraft.body)}</textarea></label><label class="row"><input id="forum-rules" type="checkbox"><span>Je respecte les règles de la communauté et évite de publier mes données personnelles.</span></label><button class="btn" onclick="postForum()">Publier ${doctorPreview?'dans la démo':'sur cet appareil'}</button></section>`:'<section class="card module-card"><p>Connecte-toi et accepte le consentement patient pour participer à cette démonstration.</p></section>'}${posts.map(p=>forumPostCard(p,permitted)).join('')||'<div class="module-empty">Aucune discussion dans ce thème.</div>'}</div><aside class="forum-side"><section class="card module-card"><h3>Une communauté bienveillante</h3><ul><li>Respecte les personnes et leur vécu.</li><li>Évite les noms, téléphones, dossiers et résultats identifiables.</li><li>Aucun diagnostic ni prescription entre membres.</li><li>Pas de conseils pour modifier un traitement.</li><li>Signale les contenus problématiques.</li></ul></section><section class="card module-card"><h3>Besoin d’aide médicale ?</h3><p>Le forum n’est pas un service d’urgence. Les réponses d’autres patients ne remplacent pas ton médecin.</p><button class="utility-button urgent" onclick="openModule('help')">Aide & urgences</button></section></aside></div>`}
function forumPostCard(p,permitted){const liked=(p.likes||[]).includes(U);return `<article class="card module-card forum-post"><div class="forum-header"><div class="forum-avatar">${esc((p.alias||'?')[0].toUpperCase())}</div><div><b>${esc(p.alias)}</b><small>${dnDate(p.t)} · ${esc(p.channel)}${p.sample?' · Discussion d’exemple':''}</small></div></div><h3>${esc(p.title)}</h3><p class="forum-body">${esc(p.body)}</p><div class="forum-actions"><button class="utility-button" onclick="likeForum('${p.id}')" ${!permitted||p.sample?'disabled':''}>${liked?'♥':'♡'} Soutien · ${(p.likes||[]).length}</button><button class="utility-button" onclick="reportForum('${p.id}')" ${!permitted||p.sample?'disabled':''}>Signaler</button>${p.user===U&&!p.sample?`<button class="utility-button" onclick="deleteForum('${p.id}')">Supprimer</button>`:''}</div><div class="forum-replies">${(p.replies||[]).map(r=>`<div class="forum-reply"><b>${esc(r.alias)}</b>${esc(r.body)}</div>`).join('')}${permitted&&!p.sample?`<div class="forum-reply-form"><input id="reply-${p.id}" aria-label="Réponse à ${esc(p.title)}" maxlength="1000" value="${esc(forumReplyDrafts[p.id]||'')}" placeholder="Répondre…" oninput="forumReplyDrafts['${p.id}']=this.value"><button class="utility-button" onclick="replyForum('${p.id}')">Répondre</button></div>`:''}</div></article>`}
function forumAllowed(){return !!U&&(doctorPreview||ROLE==='medecin'||!!S.consent)}
function writeForumPosts(posts){if(doctorPreview){forumDemoPosts=posts;return true}return ccWrite('cc-forum-posts',posts)}
function storedForumPosts(){return doctorPreview?forumDemoPosts:ccRead('cc-forum-posts',[])}
function postForum(){if(!forumAllowed())return toast('Connecte-toi pour participer.');captureForumDraft();const d=forumDraft;if(d.alias.trim().length<2||d.title.trim().length<4||d.body.trim().length<5)return toast('Ajoute un pseudo, un titre et un message.');if(!$('#forum-rules').checked)return toast('Accepte les règles de la communauté.');const posts=storedForumPosts();posts.push({id:'p'+crypto.randomUUID().replace(/-/g,''),user:U,alias:d.alias.trim().slice(0,32),channel:d.channel,title:d.title.trim().slice(0,120),body:d.body.trim().slice(0,2000),t:Date.now(),replies:[],likes:[]});if(writeForumPosts(posts)){forumDraft={alias:d.alias,channel:d.channel,title:'',body:''};render();toast('Discussion enregistrée '+(doctorPreview?'dans la démo.':'sur cet appareil.'))}}
function likeForum(id){if(!forumAllowed())return;captureForumDraft();const posts=storedForumPosts(),p=posts.find(p=>p.id===id);if(!p)return;p.likes=(p.likes||[]).includes(U)?p.likes.filter(u=>u!==U):[...(p.likes||[]),U];if(writeForumPosts(posts))render()}
function replyForum(id){if(!forumAllowed())return;captureForumDraft();const body=$('#reply-'+id)?.value.trim();if(!body||body.length<2)return toast('Écris une réponse.');const alias=forumDraft.alias.trim();if(alias.length<2)return toast('Indique ton pseudo dans le formulaire de discussion.');const posts=storedForumPosts(),p=posts.find(p=>p.id===id);if(!p)return;(p.replies=p.replies||[]).push({user:U,alias:alias.slice(0,32),body:body.slice(0,1000),t:Date.now()});if(writeForumPosts(posts)){delete forumReplyDrafts[id];render();toast('Réponse enregistrée localement.')}}
function reportForum(id){if(!forumAllowed())return;captureForumDraft();const reports=forumReports();if(!reports.some(r=>r.user===U&&r.post===id))reports.push({user:U,post:id,t:Date.now()});if(doctorPreview)forumDemoReports=reports;else if(!ccWrite('cc-forum-reports',reports))return;render();toast('Message masqué pour toi sur cet appareil. Aucune équipe de modération n’a été contactée.')}
function deleteForum(id){if(!forumAllowed())return;captureForumDraft();const p=storedForumPosts().find(p=>p.id===id);if(!p||p.user!==U)return;if(writeForumPosts(storedForumPosts().filter(p=>p.id!==id)))render()}

ar:'تتوفر القوائم والأوامر الرئيسية بست لغات. تبقى بعض النصوص التفصيلية والإرشادات الطبية ونماذج الموافقة بالفرنسية. يجب التحقق من الترجمة الطبية قبل الاستخدام الفعلي. لا تُترجم البيانات التي تدخلها.',
es:'La navegación y los controles principales están disponibles en seis idiomas. Algunos textos, consejos médicos y consentimientos siguen en francés. Las traducciones clínicas requieren validación antes del uso real. Tus datos no se traducen.',
pt:'A navegação e os comandos principais estão disponíveis em seis idiomas. Alguns textos, orientações médicas e consentimentos permanecem em francês. As traduções clínicas precisam de validação antes do uso real. Seus dados não são traduzidos.'};
function tr(text){const index=['fr','en','zh','ar','es','pt'].indexOf(uiLanguage);return UI_MAP.get(text)?.[index]||text}
const translationSources=new WeakMap();let languageObserver=null;
function translateInterface(){languageObserver?.disconnect();document.documentElement.lang=uiLanguage;document.documentElement.dir=uiLanguage==='ar'?'rtl':'ltr';
// Only allowlisted interface labels; no patient names, free text, forum bodies or clinical advice.
const labels=document.querySelectorAll('button,option,h1,h2,h3,.utility-title,.auth-badge,.auth-divider,.clinic-eyebrow,.clinic-top strong,nav span,.tile small,.fl,label.row,.feature-tile strong,.clinic-logo small,th');
for(const el of labels){if(el.closest('[data-i18n-skip],.module-hospital,.forum-post h3,.clinic-person,.clinic-user'))continue;for(const node of el.childNodes){if(node.nodeType!==Node.TEXT_NODE)continue;let source=translationSources.get(node);if(source===undefined){source=node.textContent;translationSources.set(node,source)}const trimmed=source.trim();let translated=tr(trimmed);const prefix=trimmed.match(/^([←◐✚◎▣⌖☏⌘]\s*)(.*)$/);if(prefix)translated=prefix[1]+tr(prefix[2]);const value=source.replace(trimmed,translated);if(node.textContent!==value)node.textContent=value}}
for(const el of document.querySelectorAll('input,select,textarea,button')){let values=translationSources.get(el);if(!values){values={};for(const attr of ['placeholder','aria-label'])if(el.hasAttribute(attr))values[attr]=el.getAttribute(attr);translationSources.set(el,values)}for(const [attr,value]of Object.entries(values))el.setAttribute(attr,tr(value))}
const notice=$('#language-notice');if(notice)notice.textContent=LANGUAGE_NOTES[uiLanguage];const scope=$('#translation-scope');if(scope){scope.hidden=uiLanguage==='fr';scope.textContent=LANGUAGE_NOTES[uiLanguage]}observeLanguage();}
function observeLanguage(){if(languageObserver)languageObserver.observe(document.body,{subtree:true,childList:true,characterData:true})}
function initializeLanguages(){languageObserver=new MutationObserver(translateInterface);translateInterface()}
function setLanguage(value){if(!Object.hasOwn(LANGUAGES,value))return;const draft=[...document.querySelectorAll('#view input[id],#view textarea[id],#view select[id]')].map(el=>({id:el.id,value:el.value,checked:el.checked}));uiLanguage=value;ccWrite('cc-language',value);applyAppearance();render();for(const field of draft){const el=document.getElementById(field.id);if(el){el.value=field.value;if(el.type==='checkbox')el.checked=field.checked}}translateInterface()}
function languageOptions(){return Object.entries(LANGUAGES).map(([key,l])=>`<button class="theme-choice ${key===uiLanguage?'selected':''}" lang="${key}" aria-pressed="${key===uiLanguage}" onclick="setLanguage('${key}')">${l.name}</button>`).join('')}
function languagesPage(){return moduleHeader('languages',tr('Choisir ma langue'))+`<section class="card module-card"><h3>Choisir ma langue</h3><div class="language-grid">${languageOptions()}</div><p class="language-notice" id="language-notice">${LANGUAGE_NOTES[uiLanguage]}</p></section><section class="card module-card"><h3>Mode lecture facile</h3><label class="row"><input type="checkbox" ${appearance.easyMode?'checked':''} onchange="setAppearance('easyMode',this.checked)"><span>${tr('Mode lecture facile (grands boutons et accueil simplifié)')}</span></label><label class="row"><input type="checkbox" ${appearance.largeText?'checked':''} onchange="setAppearance('largeText',this.checked)"><span>${tr('Agrandir les textes')}</span></label><label class="row"><input type="checkbox" ${appearance.motion?'checked':''} onchange="setAppearance('motion',this.checked)"><span>${tr('Activer les animations douces')}</span></label><p class="module-note">Le mode facile augmente les textes et les zones tactiles. L’accueil patient présente les médicaments, les mesures, les appels d’aide et les outils. Les réglages restent disponibles ici. Utiliser le lecteur d’écran du téléphone si nécessaire ; les champs et boutons conservent leurs libellés accessibles.</p></section><section class="card module-card"><h3>Sans Internet</h3><ol><li>Installer la PWA et l’ouvrir une première fois avec Internet.</li><li>Tester le mode avion avant de compter sur l’accès hors connexion.</li><li>Saisir les mesures et consulter l’annuaire intégré sur le même appareil.</li></ol><p class="module-note">L’indicateur de réseau ne signifie pas que les dossiers sont synchronisés. Sans serveur, aucune mesure n’est envoyée au médecin. Les cartes externes, Apple/Google et les liens web nécessitent Internet ; les appels nécessitent un réseau téléphonique.</p></section>`}
function easyNavLabel(key){return ({fr:{home:'Accueil',mes:'Mesures',med:'Médic.',more:'Plus'},en:{home:'Home',mes:'Readings',med:'Meds',more:'More'},zh:{home:'首页',mes:'测量',med:'药物',more:'更多'},ar:{home:'الرئيسية',mes:'القياسات',med:'الأدوية',more:'المزيد'},es:{home:'Inicio',mes:'Medidas',med:'Medic.',more:'Más'},pt:{home:'Início',mes:'Medidas',med:'Medic.',more:'Mais'}})[uiLanguage][key]}
function easyHome(){const tk=S.taken[day()]||[];return `<h2>${tr("Aujourd'hui")}</h2><p class="mute">${new Date().toLocaleDateString(uiLocale(),{weekday:'long',day:'numeric',month:'long'})}</p><div class="easy-actions"><button class="btn" onclick="${S.meds.length?"document.getElementById('easy-medicines').scrollIntoView({block:'center'});document.querySelector('#easy-medicines input')?.focus()":"go('med')"}">${ci('pill')} ${tr('Prendre mes médicaments')}<small>${tk.length} / ${S.meds.length}</small></button><button class="btn" onclick="go('mes')">${ci('chart')} ${tr('Ajouter une mesure')}</button><button class="btn" onclick="openModule('help')">✚ ${tr('Contacter une aide')}</button><button class="btn" onclick="go('more')">◎ ${tr('Plus de possibilités')}</button></div><section class="card" id="easy-medicines" style="margin-top:18px"><h3>${tr('Mes médicaments')}</h3>${S.meds.slice().sort((a,b)=>a.time.localeCompare(b.time)).map(m=>`<label class="row"><input type="checkbox" ${tk.includes(m.id)?'checked':''} onchange="tog('${m.id}')"><span data-i18n-skip>${esc(m.name)}</span><time>${m.time}</time></label>`).join('')||'<p class="mute">Aucun médicament enregistré.</p>'}</section><section class="card" style="margin-top:18px"><h3>${tr('Dernières mesures')}</h3><div class="tiles">${D[S.dz].t.map(tile).join('')}</div></section>`}
function updateNetworkStatus(){const el=$('#network-status');if(!el)return;const offline=navigator.onLine===false;el.classList.toggle('offline',offline);const labels={fr:['Internet disponible · données locales, sans synchronisation','Hors connexion · données locales sur cet appareil','Sauvegarde locale impossible : modifications non conservées'],en:['Internet available · local data, no sync','Offline · local data on this device','Local save failed: changes are not retained'],zh:['网络可用 · 本地数据，未同步','离线 · 数据保存在此设备','本地保存失败：更改未保存'],ar:['الإنترنت متاح · بيانات محلية دون مزامنة','غير متصل · بيانات محلية على هذا الجهاز','تعذر الحفظ المحلي: لم يتم حفظ التغييرات'],es:['Internet disponible · datos locales, sin sincronización','Sin conexión · datos locales en este dispositivo','Error al guardar: los cambios no se conservan'],pt:['Internet disponível · dados locais, sem sincronização','Sem conexão · dados locais neste dispositivo','Falha ao salvar: alterações não armazenadas']};el.textContent=labels[uiLanguage][storageFailed?2:offline?1:0]}
addEventListener('online',updateNetworkStatus);addEventListener('offline',updateNetworkStatus);
// Convenience lock only. Production sessions and access control require the server.
let lastInteraction=Date.now();for(const event of ['pointerdown','keydown','touchstart'])addEventListener(event,()=>lastInteraction=Date.now(),{passive:true});
setInterval(()=>{if(U&&!doctorPreview&&Date.now()-lastInteraction>15*60*1000){logout();toast('Session fermée après 15 minutes sans activité. Reconnecte-toi avec les mêmes identifiants.')}},30000);

initializeEnhancements();
(function(){let u=null;try{u=sessionStorage.getItem('cc-s')}catch(e){}if(u&&users()[u])enter(u);else authView()})();
</script>
